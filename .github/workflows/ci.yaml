name: ci workflow
on: push
jobs:
 linting:
  runs-on: ubuntu-latest
  steps:
    - name: code checkout
      uses: actions/checkout@v2
    - name: setup python
      uses: actions/setup-python@v5
      with:
       python-version: 3.8
    - name: install flake8
      run:
       python -m pip install -upgrade pip
       pip install flake8
    - name: run flake
      run: flake8 app.py
